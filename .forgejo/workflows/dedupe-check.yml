---
name: Dedupe check

on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - pnpm-lock.yaml

# Workflow-level: Forgejo gates OIDC issuance on the enable-openid-connect key
# (it ignores a GitHub-style `permissions:` block), applied to every job. It is
# the version-robust placement — current act/jobparser honors a job-level flag
# too (it resolves job-level precedence during expansion), but a workflow-level
# flag has always minted the OIDC token, so no per-job setting is needed.
enable-openid-connect: true

# pnpm defaults verify-deps-before-run to "install": a `pnpm <script>` or
# `pnpm exec` whose deps-status check sees drift re-runs a full install with
# lifecycle scripts enabled, ignoring the install step's flags. This workflow
# runs neither, but keeps the pin j4k-align requires. Only this spelling
# disables it: pnpm reads pnpm_config_verify_deps_before_run raw from the
# environment, and the npm_config_ spelling is silently ignored.
env:
  pnpm_config_verify_deps_before_run: "false"
  # An in-tree store would put node_modules above the global virtual store's package
  # files and mask dependency-declaration leaks from TypeScript; keep it out of the workspace.
  # Forge jobs skip pnpm/action-setup when the job image already has the pinned pnpm, and
  # the pnpm cache version includes the store path. Setting the store directory explicitly
  # gives the skipped and the installing runs the same path, so they share one cache entry.
  pnpm_config_store_dir: /tmp/pnpm-store

jobs:
  dedupe-check:
    # Fork and AGit PRs skip this job, and Forgejo counts the skip as a pass;
    # commit-msg.yml's same-repo-pr job fails them instead. When a trusted
    # user reopens one whose poster lacks Actions trust, Forgejo runs this base
    # copy unapproved against the PR head. AGit flow 1 reuses this repo's identity;
    # toJSON rejects a missing, null, '' or '0' flow that a bare == 0 would admit.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      toJSON(github.event.pull_request.flow) == '0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Strip untrusted project install config
        # pull_request checks out attacker-controlled code: remove its install config, which can redirect installs or leak the registry token, and its pnpmfiles, whose hooks run even under --ignore-scripts.
        run: rm -f .npmrc .pnpmfile.cjs .pnpmfile.mjs

      # Skip pnpm/action-setup's download when the job image already has the exact pnpm version packageManager names; otherwise the action installs it.
      - name: Check for baked pnpm
        id: baked-pnpm
        run: |
          set -eu
          probe="$(mktemp -d "$RUNNER_TEMP/baked-pnpm.XXXXXX")"
          trap '[ -z "$probe" ] || rm -rf "$probe"' EXIT
          printf '{"private":true}\n' > "$probe/package.json"
          baked="$(cd "$probe" && pnpm --version 2>/dev/null)" || baked=""
          pin="$(node -p 'const pin = JSON.parse(require("node:fs").readFileSync("./package.json", "utf8")).packageManager; typeof pin === "string" ? pin : ""' 2>/dev/null)" || pin=""
          if [ -n "$baked" ] && [ "$pin" = "pnpm@$baked" ]; then
            echo "pnpm $baked in the image matches packageManager; skipping pnpm/action-setup."
            echo "match=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$baked" ]; then
            echo "pnpm $baked in the image does not match packageManager; pnpm/action-setup installs the pinned version."
            echo "match=false" >> "$GITHUB_OUTPUT"
          else
            echo "No pnpm in the image; pnpm/action-setup installs the pinned version."
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.baked-pnpm.outputs.match != 'true'
        uses: pnpm/action-setup@v5

      - name: Require the job image's baked Node
        env:
          REQUIRED_NODE_VERSION_FILE: ".node-version"
        run: |
          set -eu
          if [ -n "${REQUIRED_NODE_VERSION:-}" ] && [ -z "${REQUIRED_NODE_VERSION_FILE:-}" ]; then
            version="$REQUIRED_NODE_VERSION"
            pin="this workflow's Node pin"
          elif [ -z "${REQUIRED_NODE_VERSION:-}" ] && [ -n "${REQUIRED_NODE_VERSION_FILE:-}" ]; then
            version="$(cat -- "$REQUIRED_NODE_VERSION_FILE")"
            pin="$REQUIRED_NODE_VERSION_FILE"
          else
            echo "::error::The baked Node check needs exactly one of REQUIRED_NODE_VERSION and REQUIRED_NODE_VERSION_FILE."
            exit 1
          fi
          case "$version" in
            "" | *[!0-9.]* | .* | *. | *..* | *.*.*.*) exact=false ;;
            *.*.*) exact=true ;;
            *) exact=false ;;
          esac
          if [ "$exact" != true ]; then
            echo "::error::$pin does not name an exact Node version (X.Y.Z), so setup-node would resolve it from GitHub."
            exit 1
          fi
          if [ ! -f "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/node/$version/x64.complete" ]; then
            echo "::error::This job image does not bake Node $version, so setup-node would download it from GitHub. If $pin is older than j4k-align's policy, run j4k-align --fix. Otherwise bake Node $version in j4k/cluster node_ci_node_versions first."
            exit 1
          fi
          echo "Node $version is baked into this job image."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        # Not setup-node's `cache: pnpm`: the Forgejo runner's cache server lowercases keys and setup-node compares the matched key case-sensitively, so an exact hit never counts as one there and the store is uploaded again. actions/cache compares them case-insensitively.
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Configure registry auth
        env:
          NPM_READ_AUDIENCE: ${{ vars.NPM_READ_AUDIENCE }}
        run: |
          set -eu
          if [ -z "${NPM_READ_AUDIENCE:-}" ]; then
            echo "::error::NPM_READ_AUDIENCE variable is not set. It is the server-generated audience for the org npm-reader integration; reconcile it from j4k-cluster."
            exit 1
          fi
          # Fail with a clear message, not a raw curl error, when the OIDC request vars are absent (fork PR, or enable-openid-connect inactive).
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No Actions OIDC token on this run (a fork PR Forgejo withholds it from, or enable-openid-connect is inactive)."
            exit 1
          fi
          # Forgejo appends `&audience=` to the placeholder-terminated request URL
          # and returns {"value": "<jwt>"}. The registry accepts the JWT as a
          # Bearer _authToken for the integration owner. pnpm ignores env
          # references in credentials it does not expand itself, so the token is
          # written literally into the trusted user-level ~/.npmrc.
          NODE_AUTH_TOKEN="$(
            curl -fsSL \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL:-}&audience=${NPM_READ_AUDIENCE}" \
              | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p'
          )"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Failed to obtain an Actions OIDC token for the private registry install."
            exit 1
          fi
          # A curl-fetched token is not auto-masked like a secrets.* value; register it so no later step can print it.
          echo "::add-mask::${NODE_AUTH_TOKEN}"
          echo "//code.j4k.dev/api/packages/j4k/npm/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          # Workflow-level enable-openid-connect exposes ACTIONS_ID_TOKEN_REQUEST_* to every step; blank them so no later (PR-controlled) step can mint another token.
          printf 'ACTIONS_ID_TOKEN_REQUEST_URL=\nACTIONS_ID_TOKEN_REQUEST_TOKEN=\n' >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Check for dedupe opportunities
        # Keep --ignore-pnpmfile: pnpm loads pnpmfiles for every command and --ignore-scripts does not block them, so a PR could point pnpm-workspace.yaml's pnpmfile setting at a file that survives the .pnpmfile.* strip and runs arbitrary code with the registry token in ~/.npmrc. Keep registry credentials available for authenticated dedupe.
        run: pnpm dedupe --check --ignore-scripts --ignore-pnpmfile

      - name: Save pnpm store
        # Last step, so it saves only after the whole job succeeded. The key comes from the restore step so install cannot change it. Pull requests only restore, so a miss never adds an upload to a PR's critical path; every other event saves.
        if: github.event_name != 'pull_request' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
