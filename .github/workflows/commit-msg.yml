---
name: commit-msg

# Validate on pull_request only; a post-merge --last check would choke on the
# immutable, auto-composed squash body whose lines exceed the body-length limit.

on:
  pull_request:
    # `edited` is required: a base-branch retarget fires only `edited`. It also
    # fires on title and body edits, so a title change rechecks the squash subject.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  # Reading the current pull request needs more than contents: read.
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMMITLINT_PACKAGE_VERSION: "1.0.8"
      # Reserve job time for npm retries by bounding each fetch attempt.
      npm_config_fetch_timeout: "30000"
      npm_config_fetch_retries: "3"
      npm_config_fetch_retry_mintimeout: "1000"
      npm_config_fetch_retry_maxtimeout: "10000"
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetches every branch, so the lint step finds the base without a fetch.
          fetch-depth: 0
          # The lint step runs PR-controlled npm config, which could read a
          # persisted token from the Git config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Deliberately policy-pinned: this workflow runs only a version-pinned npm package and takes no toolchain input from the PR tree — the template, not node-version-file, supplies the fleet baseline.
          node-version: "26.5.0"

      - name: Cache conventional-commit-msg download
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-conventional-commit-msg-${{ env.COMMITLINT_PACKAGE_VERSION }}

      - name: Read the current pull request
        # Reruns can replay stale metadata, so read the current pull request;
        # the lint step still uses this run's event head.
        # Only this step needs the job token. The lint step runs npm on the
        # PR's checkout, so it first drops the credentials the runner exports
        # and pins the npm registry.
        shell: bash
        env:
          # Pass attacker-controllable event fields via env, never inline in run: (script injection).
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "$PR_NUMBER" in
            ""|*[!0-9]*)
              printf 'refusing pull request number %s\n' "$PR_NUMBER" >&2
              exit 1
              ;;
          esac

          api_root=${API_URL%/}
          pr_json=$(
            curl -fsS \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${api_root}/repos/${REPOSITORY}/pulls/${PR_NUMBER}"
          )
          pr_fields="${RUNNER_TEMP}/commit-msg-pr"
          mkdir -p "$pr_fields"
          printf '%s' "$pr_json" | FIELD_REF="$pr_fields/ref" FIELD_TITLE="$pr_fields/title" node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const fs=require("node:fs");const pr=JSON.parse(s);const ref=pr?.base?.ref;const title=pr?.title;if(typeof ref!=="string"||ref.length===0){process.stderr.write("pull request response has no base ref\n");process.exit(1)}if(typeof title!=="string"){process.stderr.write("pull request response has no title\n");process.exit(1)}fs.writeFileSync(process.env.FIELD_REF,ref);fs.writeFileSync(process.env.FIELD_TITLE,title)})'

      - name: Validate commit messages with commitlint
        # Validate messages that an enabled merge method can place on the
        # target branch.
        shell: bash
        env:
          # Pass attacker-controllable event fields via env, never inline in run: (script injection).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Forgejo's runner exports credentials to every step: the job token,
          # the Actions runtime and OIDC request tokens, and a cache URL whose
          # run key authenticates to the cache proxy. npm expands ${VAR} in the
          # PR's .npmrc, and commitlint runs a JS config from the PR's checkout,
          # so drop them first. The PR's code still runs in this job; this only
          # keeps them out of its environment.
          unset GITHUB_TOKEN FORGEJO_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_CACHE_URL

          case "$HEAD_SHA" in
            *[!0-9a-fA-F]*)
              printf 'refusing head sha %s\n' "$HEAD_SHA" >&2
              exit 1
              ;;
          esac
          if [ "${#HEAD_SHA}" -ne 40 ] && [ "${#HEAD_SHA}" -ne 64 ]; then
            printf 'refusing head sha %s\n' "$HEAD_SHA" >&2
            exit 1
          fi

          pr_fields="${RUNNER_TEMP}/commit-msg-pr"
          base_ref=$(cat "$pr_fields/ref")

          # Squash: the PR title becomes the target branch's subject.
          { cat "$pr_fields/title"; printf '\n'; } \
            | npm exec --yes --registry https://registry.npmjs.org --package=conventional-commit-msg@${COMMITLINT_PACKAGE_VERSION} -- \
              conventional-commit-msg

          # Forgejo allows branch names that start with "-", which --branch rejects.
          git check-ref-format "refs/heads/${base_ref}"
          from=$(git rev-parse "refs/remotes/origin/${base_ref}^{commit}")

          # Rebase: the PR's individual commits land on the target branch.
          npm exec --yes --registry https://registry.npmjs.org --package=conventional-commit-msg@${COMMITLINT_PACKAGE_VERSION} -- \
            conventional-commit-msg \
            --from "$from" \
            --to "$HEAD_SHA"
