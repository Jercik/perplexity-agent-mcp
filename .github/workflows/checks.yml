---
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

# pnpm 11 defaults verify-deps-before-run to "install": the first `pnpm
# <script>` or `pnpm exec` whose deps-status check sees drift re-runs a full
# install with lifecycle scripts enabled, silently dropping this workflow's
# install flags — a prepare hook the hardened --ignore-scripts install skipped
# then runs in CI. Only this spelling disables it: pnpm reads
# pnpm_config_verify_deps_before_run raw from the environment, and the
# npm_config_ spelling is silently ignored.
env:
  pnpm_config_verify_deps_before_run: "false"
  # An in-tree store would put node_modules above the global virtual store's package
  # files and mask dependency-declaration leaks from TypeScript; keep it out of the workspace.
  pnpm_config_store_dir: /tmp/pnpm-store

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["24.15.0", "26.5.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Strip untrusted project install config
        # pull_request checks out attacker-controlled code: remove its install config, which can redirect installs or leak the registry token, and its pnpmfiles, whose hooks run even under --ignore-scripts.
        run: rm -f .npmrc .pnpmfile.cjs .pnpmfile.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        # Explicit cache steps, not setup-node's `cache: pnpm`: the Forgejo runner's cache server lowercases keys and setup-node compares the matched key case-sensitively, so every hit re-uploaded the store. actions/cache compares them case-insensitively.
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Verify install secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing required install secret FORGEJO_NPM_TOKEN; set it in the repo Actions secrets."
            exit 1
          fi

      - name: Configure registry auth
        run: echo "//code.j4k.dev/api/packages/j4k/npm/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Strip registry token
        # pull_request runs PR-controlled scripts below; remove the token before any of them reads ~/.npmrc.
        run: rm -f ~/.npmrc

      - name: Run knip
        run: pnpm run knip

      - name: Run format check
        run: pnpm run format:check

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run declaration resolution check
        run: pnpm run check:dts

      - name: Run lint
        run: pnpm run lint

      - name: Run fta
        run: pnpm run fta

      - name: Run build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Save pnpm store
        # Last step, so it saves only after the whole job succeeded, as setup-node's post step did. The key comes from the restore step so install cannot change it.
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
