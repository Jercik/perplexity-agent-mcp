---
name: Release npm

on:
  workflow_run:
    workflows:
      - Checks
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-release-npm
  cancel-in-progress: true

# pnpm 11 defaults verify-deps-before-run to "install": the first `pnpm
# <script>` or `pnpm exec` whose deps-status check sees drift re-runs a full
# install with lifecycle scripts enabled, silently dropping this workflow's
# install flags — a prepare hook the hardened --ignore-scripts install skipped
# then runs in CI. Only this spelling disables it: pnpm reads
# pnpm_config_verify_deps_before_run raw from the environment, and the
# npm_config_ spelling is silently ignored.
env:
  pnpm_config_verify_deps_before_run: "false"
  # An in-tree store would put node_modules above the global virtual store's package
  # files and mask dependency-declaration leaks from TypeScript; keep it out of the workspace.
  pnpm_config_store_dir: /tmp/pnpm-store

jobs:
  release:
    name: Release npm
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        # Explicit cache steps, not setup-node's `cache: pnpm`: the Forgejo runner's cache server lowercases keys and setup-node compares the matched key case-sensitively, so every hit re-uploaded the store. actions/cache compares them case-insensitively.
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Verify install secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing required install secret FORGEJO_NPM_TOKEN; set it in the repo Actions secrets."
            exit 1
          fi

      - name: Configure registry auth (install)
        run: echo "//code.j4k.dev/api/packages/j4k/npm/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_NPM_TOKEN }}

      - name: Install dependencies
        # Lifecycle scripts must not run while the FORGEJO_NPM_TOKEN read:package PAT is in ~/.npmrc — a non-expiring PAT that reads the whole private @j4k tree; prepack still builds at publish time.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Strip registry token
        # The private read token is only needed for installation; semantic-release must not inherit it.
        run: rm -f ~/.npmrc

      - name: Configure public npm registry (publish)
        run: echo "registry=https://registry.npmjs.org/" > ~/.npmrc

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Save pnpm store
        # Last step, so it saves only after the whole job succeeded, as setup-node's post step did. The key comes from the restore step so install cannot change it.
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
